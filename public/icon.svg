<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="sun-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="moon-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>
  
  <!-- Outer rounded background representing a safe maskable zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Astrological grid / ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1.5" />
  
  <!-- Sun & Moon Hybrid Emblem in Center -->
  <g transform="translate(256, 256)">
    <!-- Sun (left/top part) -->
    <path d="M 0 0 M -80 0 A 80 80 0 1 1 80 0 Z" fill="url(#sun-grad)" />
    <!-- Moon shadow/crescent cutout (right/bottom part) -->
    <path d="M 0 -80 A 80 80 0 0 1 80 0 A 80 80 0 0 1 0 80 A 64 64 0 0 0 0 -80 Z" fill="url(#moon-grad)" />
    
    <!-- Inner glowing node -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.9" />
  </g>
  
  <!-- Compass/Clock pointer -->
  <line x1="256" y1="256" x2="256" y2="100" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="100" r="10" fill="#fbbf24" />
</svg>
